        function AggregatedAnalytics({ surveys }) {

                        val.forEach(item => {
                            if (item) freq[item] = (freq[item] || 0) + 1;
                        });
                    } else if (val) {
                        freq[val] = (freq[val] || 0) + 1;

                return freq;

                    for (let i = 0; i < keys.length - 1; i++) {
                        if (!curr[keys[i]]) curr[keys[i]] = {};
                        curr = curr[keys[i]];

                    curr[keys[keys.length - 1]] = value;
                    return next;

        function App() {
            const [surveys, setSurveys] = useState(() => {
                const saved = localStorage.getItem('eac_chn2_surveys');
                return saved ? JSON.parse(saved) : initialMockSurveys;
            });

            const [activeTab, setActiveTab] = useState('grid'); // 'grid', 'analytics', 'form', 'print'
            const [currentSurvey, setCurrentSurvey] = useState(createEmptySurvey());
            const [searchTerm, setSearchTerm] = useState('');

            // Auto-persist to localStorage
            useEffect(() => {
                localStorage.setItem('eac_chn2_surveys', JSON.stringify(surveys));
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [surveys, activeTab]);

            // Filtered surveys
            const filteredSurveys = useMemo(() => {
                if (!searchTerm.trim()) return surveys;
                const term = searchTerm.toLowerCase();
                return surveys.filter(s => 
                    s.meta.informantInitials?.toLowerCase().includes(term) ||
                    s.meta.address?.toLowerCase().includes(term) ||
                    s.meta.studentNurse?.toLowerCase().includes(term) ||
                    s.sectionI.drinkingWater.source?.toLowerCase().includes(term) ||
                    s.sectionI.toiletType.type?.toLowerCase().includes(term)
                );
            }, [surveys, searchTerm]);

            // Handlers
            const handleAddNew = () => {
                setCurrentSurvey(createEmptySurvey());
                setActiveTab('form');
            };

            const handleEditRow = (survey) => {
                setCurrentSurvey(JSON.parse(JSON.stringify(survey)));
                setActiveTab('form');
            };

            const handleDeleteRow = (id) => {
                if (window.confirm('Are you sure you want to delete this household survey record from the tally sheet?')) {
                    setSurveys(prev => prev.filter(s => s.id !== id));
                }
            };

            const handleSaveForm = () => {
                setSurveys(prev => {
                    const exists = prev.some(s => s.id === currentSurvey.id);
                    if (exists) {
                        return prev.map(s => s.id === currentSurvey.id ? currentSurvey : s);
                    } else {
                        return [currentSurvey, ...prev];
                    }
                });
                setActiveTab('grid');
            };

            const handleExportCSV = () => {
                const headers = ["Informant", "Contact", "Address", "Date", "Student Nurse", "Members Count", "Ownership", "Water Source", "Toilet Type", "Monthly Income"];
                const rows = surveys.map(s => [
                    `"${s.meta.informantInitials || ''}"`,
                    `"${s.meta.contactNumber || ''}"`,
                    `"${s.meta.address || ''}"`,
                    `"${s.meta.dateOfAssessment || ''}"`,
                    `"${s.meta.studentNurse || ''}"`,
                    s.sectionI.householdMembers.length,
                    `"${s.sectionI.homeEnvironment.ownership || ''}"`,
                    `"${s.sectionI.drinkingWater.source || ''}"`,
                    `"${s.sectionI.toiletType.type || ''}"`,
                    s.sectionII.familyMonthlyIncome || 0
                ]);
                const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `EAC_CHN2_Community_Health_Tally_${new Date().toISOString().split('T')[0]}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            return (
                <div className="flex-1 flex flex-col h-full overflow-hidden">
                    <HeaderBar 
                        activeTab={activeTab} 
                        setActiveTab={setActiveTab} 
                        surveysCount={surveys.length}
                        onAddNew={handleAddNew}
                        onExport={handleExportCSV}
                    />

                    {activeTab === 'grid' && (
                        <MasterGridSheet 
                            surveys={filteredSurveys} 
                            onEditRow={handleEditRow}
                            onDeleteRow={handleDeleteRow}
                            searchTerm={searchTerm}
                            setSearchTerm={setSearchTerm}
                        />
                    )}

                    {activeTab === 'analytics' && (
                        <AggregatedAnalytics surveys={surveys} />
                    )}

                    {activeTab === 'form' && (
                        <SurveyForm 
                            survey={currentSurvey} 
                            setSurvey={setCurrentSurvey} 
                            onSave={handleSaveForm}
                            onCancel={() => setActiveTab('grid')}
                        />
                    )}

                    {activeTab === 'print' && (
                        <PrintableOfficialView 
                            survey={currentSurvey.id ? currentSurvey : surveys[0]} 
                            onPrint={() => window.print()}
                        />
                    )}
                </div>
            );
        }

        // Render application
        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
